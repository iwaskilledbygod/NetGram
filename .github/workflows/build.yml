name: CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          if [ -d "/Applications/Xcode_$XCODE_VERSION.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"
          else
            # pinned Xcode not available on this runner image; use the default one
            xcode-select -p
          fi

      - name: Restore Bazel cache
        uses: actions/cache@v4
        with:
          path: |
            /private/var/tmp/netgram-bazel-cache/disk
            /private/var/tmp/netgram-bazel-cache/repos
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'versions.json') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          # NetGram has its own version line; do not reuse Telegram's official
          # build numbering (commit count + offset).
          export BUILD_NUMBER="0.0.3"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          # rewrite fake profiles for the fork's bundle id
          python3 -I build-system/Make/PatchFakeProfiles.py \
            --path build-system/fake-codesigning \
            --bundleId="ios.NetGram.pvpsoldier"

          # route bazel caches to the actions/cache-managed directories
          echo "build --disk_cache=/private/var/tmp/netgram-bazel-cache/disk" >> .bazelrc
          echo "build --repository_cache=/private/var/tmp/netgram-bazel-cache/repos" >> .bazelrc
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          IPA=""
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa bazel-bin/Telegram/Telegram.ipa; do
            if [ -f "$f" ]; then IPA="$f"; break; fi
          done
          if [ -z "$IPA" ]; then echo "Telegram.ipa not found"; exit 1; fi
          cp "$IPA" $OUTPUT_PATH/

          # collect dsym
          mkdir -p build/DSYMs
          DSYM_SRC=$(dirname "$IPA")
          for f in "$DSYM_SRC"/*.dSYM; do
            cp -R "$f" build/DSYMs/
          done
          zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null

      - name: Validate IPA before release
        run: |
          cd /Users/Shared/telegram-ios
          python3 -I build-system/Make/ValidateIPA.py \
            build/artifacts/Telegram.ipa \
            build-system/appstore-configuration.json

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}-${{ github.run_id }}
          # Название релиза без номера сборки. Перед запуском сборки обнови
          # «Что нового» ниже — только изменения, видимые пользователю.
          release_name: NetGram ${{ env.APP_VERSION }}
          body: |
            NetGram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }}) — unsigned build, re-sign to install.

            ## Что нового
            - Список сеансов: устройства теперь подписываются настоящими именами приложений — Telegram iOS, Telegram Desktop, Telegram macOS и т.д. Сеанс NetGram подписан как NetGram.
            - Экран сеанса («Application») показывает то же корректное имя.
            - Версия сборки: 13.2 (0.0.3) — видна в debug-меню и в сеансах.
          draft: false
          prerelease: false

      - name: Upload Release IPA
        id: upload-release-ipa 
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          asset_name: NetGram.ipa
          asset_content_type: application/zip

      - name: Upload Release DSYM
        id: upload-release-dsym 
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          asset_name: NetGram.DSYMs.zip
          asset_content_type: application/zip
